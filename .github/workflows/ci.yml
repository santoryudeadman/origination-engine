name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nothing here needs network, keys or an install step.
      - name: No credentials in the tree
        run: node scripts/check-secrets.mjs

      - name: Pipeline receipt, determinism, and promotion gate
        run: node scripts/verify.mjs
