# Cloudflare Workers — static assets only. No bindings, no compute, no secrets.
#
#   npx wrangler deploy
#
# Free plan: 100,000 requests/day. The plan has no payment method, so exceeding the
# allowance returns errors — it cannot bill you. That hard ceiling IS the cost rail.
#
# The page replays recorded runs from site/data/*.json. It never holds a credential:
# every live call happens in the CLI (pipeline/run.mjs), not in the browser.

name = "origination-engine"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./site"
